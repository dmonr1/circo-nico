<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Nico</title>
    <meta
      name="description"
      content="Una invitacion romantica y animada para una noche de circo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="loader" id="loader" aria-label="Preparando funcion">
      <canvas class="loader-spiral" id="loaderSpiral" aria-hidden="true"></canvas>
      <div class="loader-marquee">
        <span id="loaderNumber">0%</span>
      </div>
      <div class="loader-story" aria-live="polite">
        <div class="beba-stage">
          <img
            class="beba-image"
            src="imgs/beba_circo.png"
            alt="Beba en el circo"
          />
        </div>
        <div class="story-copy">
          <h1>Presentamos a la “GRAN BEBA”</h1>
          <p
            id="storyText"
            data-text="Bienvenida a mi circo. Dicen que la magia aparece cuando hay ganas de reir, sorprenderse y guardar un momento bonito."
          ></p>
          <button class="continue-button" id="continueButton" type="button">
            Acompáñame
          </button>
        </div>
      </div>
      <div class="presentation-confetti" id="presentationConfetti" aria-hidden="true"></div>
    </section>

    <main class="scene" aria-label="Invitacion romantica al circo">
      <div class="sky" aria-hidden="true">
        <div class="sky-layer sky-night"></div>
        <div class="sky-layer sky-day">
          <span class="cloud cloud-one"></span>
          <span class="cloud cloud-two"></span>
          <span class="cloud cloud-three"></span>
        </div>
      </div>
      <div class="stars" aria-hidden="true"></div>
      <div class="grass" aria-hidden="true"></div>
      <button class="return-show-sign" id="returnShowButton" type="button">
        Vuelve a entrar<br />a la función
      </button>
      <div class="walking-beba" aria-hidden="true">
        <img src="imgs/caminando_beba.png" alt="" />
        <span class="arrival-dialog">Entremos a la función</span>
      </div>

      <section class="circus" aria-label="Carpa del circo">
        <button
          class="moon"
          id="toggleSky"
          type="button"
          aria-label="Cambiar de noche a dia"
        >
          <span class="sun" aria-hidden="true">
            <span class="sun-anime">
              <span class="sun-ball"></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
              <span class="sun-light"><b></b><s></s></span>
            </span>
          </span>
        </button>
        <div class="tent">
          <div class="back-lights" aria-hidden="true">
            <span class="spotlight spotlight-left"></span>
            <span class="spotlight spotlight-right"></span>
          </div>
          <div class="string-lights" aria-hidden="true">
            <span class="light-strand strand-left">
              <i></i><i></i><i></i><i></i>
            </span>
            <span class="light-strand strand-right">
              <i></i><i></i><i></i><i></i>
            </span>
          </div>
          <div class="flag"></div>
          <div class="tent-top"></div>
          <div class="tent-body">
            <div class="tent-stripe stripe-one"></div>
            <div class="tent-stripe stripe-two"></div>
            <button
              class="door"
              id="enterTent"
              type="button"
              aria-label="Entrar a la carpa"
              disabled
            ></button>
          </div>
        </div>
      </section>

      <section class="inside-stage" id="insideStage" aria-label="Interior de la carpa">
        <div class="stage-curtains" aria-hidden="true">
          <span class="curtain-side curtain-left"></span>
          <span class="curtain-side curtain-right"></span>
        </div>
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="magic-act">
          <img
            class="stage-beba"
            src="imgs/beba_mirando_al_lado.png"
            alt="Beba mirando al lado"
          />
          <div class="magic-dialog">
            <p
              id="magicDialogText"
              data-text="Para mi primer truco tendras que elegir una carta. Este sera el juego de adivinar las cartas."
            ></p>
            <button class="prize-button" id="prizeButton" type="button">
              Ver mi premio
            </button>
          </div>
        </div>
        <div class="card-game" id="cardGame" aria-label="Juego de adivinar las cartas">
          <button class="magic-card" type="button" data-card="A de corazones" data-color="red">
            <span class="card-front"><span class="card-corner card-corner-top"><b>A</b><i>♥</i></span><span class="card-suit">♥</span><span class="card-corner card-corner-bottom"><b>A</b><i>♥</i></span></span>
            <span class="card-back">?</span>
          </button>
          <button class="magic-card" type="button" data-card="7 de diamantes" data-color="red">
            <span class="card-front"><span class="card-corner card-corner-top"><b>7</b><i>♦</i></span><span class="card-suit">♦</span><span class="card-corner card-corner-bottom"><b>7</b><i>♦</i></span></span>
            <span class="card-back">?</span>
          </button>
          <button class="magic-card" type="button" data-card="Q de tréboles" data-color="black">
            <span class="card-front"><span class="card-corner card-corner-top"><b>Q</b><i>♣</i></span><span class="card-suit">♣</span><span class="card-corner card-corner-bottom"><b>Q</b><i>♣</i></span></span>
            <span class="card-back">?</span>
          </button>
          <button class="magic-card" type="button" data-card="3 de picas" data-color="black">
            <span class="card-front"><span class="card-corner card-corner-top"><b>3</b><i>♠</i></span><span class="card-suit">♠</span><span class="card-corner card-corner-bottom"><b>3</b><i>♠</i></span></span>
            <span class="card-back">?</span>
          </button>
          <button class="magic-card" type="button" data-card="K de corazones" data-color="red">
            <span class="card-front"><span class="card-corner card-corner-top"><b>K</b><i>♥</i></span><span class="card-suit">♥</span><span class="card-corner card-corner-bottom"><b>K</b><i>♥</i></span></span>
            <span class="card-back">?</span>
          </button>
          <button class="magic-card" type="button" data-card="10 de diamantes" data-color="red">
            <span class="card-front"><span class="card-corner card-corner-top"><b>10</b><i>♦</i></span><span class="card-suit">♦</span><span class="card-corner card-corner-bottom"><b>10</b><i>♦</i></span></span>
            <span class="card-back">?</span>
          </button>
        </div>
        <p class="card-result" id="cardResult" aria-live="polite"></p>
        <button class="number-step-button" id="numberStepButton" type="button">
          OK
        </button>
        <div class="circus-ring" aria-hidden="true"></div>
        <section class="prize-ticket" id="prizeTicket" aria-label="Premio de la funcion">
          <div class="ticket">
            <span class="ticket-face ticket-front">
              <span class="admit">
                <strong>Circo</strong>
                <small>Invitación especial</small>
              </span>
              <span class="ticket-main">
                <span class="stars-row">★ ★ ★ ★ ★</span>
                <span class="show-name">7 de agosto · 8:00 p. m.</span>
                <span class="balloons" aria-hidden="true">
                  <i></i>
                  <i></i>
                </span>
                <span class="circus-word">Circo</span>
                <span class="ticket-line">¿Quieres ir con Dieguito?</span>
                <span class="ticket-actions">
                  <button class="accept-ticket-button" id="acceptTicketButton" type="button">Sí</button>
                  <button class="decline-ticket-button" id="declineTicketButton" type="button">No</button>
                </span>
              </span>
            </span>
          </div>
          <div class="farewell-confetti" id="farewellConfetti" aria-hidden="true"></div>
          <div class="farewell-message" aria-live="polite">
            <strong>¡Nos vemos ese dia wujuuuu!</strong>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
