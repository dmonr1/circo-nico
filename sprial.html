<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fondo Espiral Giratorio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d9c7a8;
    font-family: 'Poppins', sans-serif;
  }

  .spiral-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #spiral {
    width: 150vmax;
    height: 150vmax;
    animation: spin 8s linear infinite;
    transform-origin: 50% 50%;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="spiral-wrap">
  <canvas id="spiral"></canvas>
</div>

<script>
  const canvas = document.getElementById('spiral');
  const size = 1200;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const imgData = ctx.createImageData(size, size);
  const data = imgData.data;

  const cx = size / 2;
  const cy = size / 2;

  const red   = [163, 27, 30];
  const cream = [222, 202, 168];

  const arms = 10;
  const tightness = 22;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.sqrt(dx * dx + dy * dy);
      const theta = Math.atan2(dy, dx);

      const value = (theta * (arms / (2 * Math.PI))) + (r / tightness);
      const phase = value - Math.floor(value);

      const idx = (y * size + x) * 4;
      const color = phase < 0.5 ? red : cream;

      data[idx]     = color[0];
      data[idx + 1] = color[1];
      data[idx + 2] = color[2];
      data[idx + 3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);
</script>

</body>
</html>
